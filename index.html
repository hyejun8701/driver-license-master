<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>운전면허 필기 마스터</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="container">
    <div class="header-title">
        <h1>🚗 운전면허 필기 마스터</h1>
        <button class="help-btn" onclick="showSwipeGuide(true)" title="스와이프 안내 다시보기">💡</button>
    </div>

    <div class="tab-group">
        <button class="tab-btn active" id="tabMemorize" onclick="switchMode('memorize')">⚡ 암기장 모드</button>
        <button class="tab-btn" id="tabExam" onclick="switchMode('exam')">📝 모의고사 모드</button>
    </div>

    <!-- 암기장 모드 전용 진행률 표시 바 -->
    <div class="progress-section" id="progressSection">
        <div class="progress-info-text">
            <span>📚 암기 완료: <strong id="memorizedCountText">0</strong> / <span id="totalCountText">0</span>문제</span>
            <span id="memorizedPercentText">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
        </div>
    </div>

    <div class="top-nav" id="topNav">
        <div id="navLeft" style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
            <div>
                <span>문제 번호: </span>
                <input type="number" id="qInput" min="1" value="1">
                <button onclick="jumpToQ()">이동</button>
            </div>
            <label class="hide-toggle-label">
                <input type="checkbox" id="hideMemorizedCheck" onchange="toggleHideMemorized()" checked>
                외운 문제 제외
            </label>
        </div>

        <div id="examStartBox" class="exam-setup-group" style="display:none;">
            <!-- 1행: 필터 설정 ('오답만 풀기' 추가) -->
            <div class="exam-setup-row">
                <div class="setup-item" style="width: 100%;">
                    <span class="setup-label">필터</span>
                    <select id="examFilterSelect" class="custom-select" style="flex: 1;">
                        <option value="all" selected>전체 문제</option>
                        <option value="unmemorized">미완료 문제만</option>
                        <option value="memorized">⭐ 외운 문제만</option>
                        <option value="incorrect">❌ 오답만 풀기</option>
                    </select>
                </div>
            </div>

            <!-- 2행: 범위 설정 -->
            <div class="exam-setup-row">
                <div class="setup-item" style="width: 100%;">
                    <span class="setup-label">범위</span>
                    <div class="range-input-container">
                        <input type="number" id="rangeStart" min="1" value="1"> 
                        <span class="range-tilde">~</span> 
                        <input type="number" id="rangeEnd" min="1" value="100">
                    </div>
                </div>
            </div>

            <!-- 3행: 문항 수 선택 및 시작 버튼 -->
            <div class="exam-setup-row">
                <div class="setup-item" style="flex: 1;">
                    <span class="setup-label">문항</span>
                    <select id="examCountSelect" class="custom-select" style="flex: 1;">
                        <option value="5" selected>5문제</option>
                        <option value="10">10문제</option>
                        <option value="20">20문제</option>
                        <option value="40">40문제</option>
                    </select>
                </div>
                <button onclick="startNewExam()" class="exam-start-btn">🚀 시작</button>
            </div>
        </div>

        <div class="timer-box" id="timerBox" style="display:none;">⏱️ 40:00</div>
        <span id="totalIdx">0 / 0</span>
    </div>

    <div class="card-wrapper" id="cardWrapper">
        <!-- 모의고사 시작 전 안내 화면 -->
        <div class="exam-ready-screen" id="examBeforeStart" style="display:none;">
            <div style="font-size: 1.5rem; margin-bottom: 8px;">📝</div>
            <div style="font-weight: bold; color: #334155; font-size: 0.95rem; margin-bottom: 4px;">모의고사 모드 준비 중</div>
            <div style="color: #64748b; font-size: 0.8rem;">상단에서 조건을 설정하고 [🚀 시작] 버튼을 눌러주세요.</div>
        </div>

        <div class="card" id="cardBox">
            <div id="loading">
                <div style="font-weight: bold; color: #2563eb; line-height: 1.4; font-size: 0.9rem;">
                    🔄 문제 데이터를 불러오는 중입니다...
                </div>
            </div>
            
            <div id="quizContent" style="display:none; flex-direction: column;">
                <div class="q-header" id="qHeader">
                    <span style="font-size:0.75rem; font-weight:bold; color:#64748b;" id="qCategory">문제</span>
                    <label class="memorized-check">
                        <input type="checkbox" id="itemMemorizedCheck" onchange="toggleItemMemorized(this.checked)">
                        완료 (외움)
                    </label>
                </div>

                <!-- 1. 지문 -->
                <div class="q-text" id="qText"></div>

                <!-- 2. 보기 -->
                <div class="options-list" id="optList" style="display:none;"></div>
                <div class="memorize-options-list" id="memOptList" style="display:none;"></div>

                <!-- 3. 이미지와 이미지 설명 가로 배치 영역 -->
                <div id="qImgContainer" class="q-img-container" style="display: none;">
                    <img id="qImage" class="q-img" src="" alt="문제 이미지">
                    <div id="qImageDesc" class="q-img-desc"></div>
                </div>
            </div>

            <div id="resultContent" class="result-screen" style="display:none;">
                <div style="font-size: 0.95rem; font-weight: bold; color: #475569;">시험 결과</div>
                <div id="scoreText" class="result-score">0점</div>
                <div id="passText" style="font-size: 1rem; font-weight: bold; margin-bottom: 6px;"></div>
                <div id="resultDetail" style="color: #64748b; font-size: 0.85rem;"></div>
                <button class="restart-btn" onclick="resetExamSetup()">🔄 다시 도전하기</button>
            </div>
        </div>
    </div>

    <div class="toast-msg" id="toastMsg">👈 좌우로 스와이프 또는 방향키(←/→)로 넘기세요</div>

    <div class="btn-group" id="btnGroup" style="display:none;">
        <button class="btn btn-submit" id="submitBtn" onclick="submitExam()">시험 제출</button>
    </div>
</div>

<script src="./script.js?v=2"></script>

</body>
</html>
