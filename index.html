<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>운전면허 필기 마스터</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- 1. 비로그인 시 노출되는 전면 로그인 화면 (초기 숨김 처리) -->
<div class="login-screen" id="loginScreen" style="display: none;">
    <div class="login-container">
        <!-- 상단 대형 타이틀 -->
        <div class="login-title">
            로그인 후<br>
            이용이<br>
            가능합니다.
        </div>

        <!-- 소셜 로그인 원형 버튼 영역 -->
        <!-- index.html의 소셜 로그인 버튼 영역 수정 -->
        <div class="social-login-group">
            <div class="social-item">
                <button class="social-btn kakao-btn" disabled>
                    <svg viewBox="0 0 24 24" width="28" height="28">
                        <path fill="#000000" d="M12 3C6.48 3 2 6.48 2 10.77c0 2.76 1.84 5.18 4.62 6.53l-1.18 4.33c-.1.38.31.69.65.48l5.12-3.4c.26.02.53.04.79.04 5.52 0 10-3.48 10-7.77C22 6.48 17.52 3 12 3z"/>
                    </svg>
                </button>
                <span class="social-label" style="opacity: 0.5;">카카오톡</span>
            </div>

            <div class="social-item">
                <button class="social-btn facebook-btn" disabled>
                    <svg viewBox="0 0 24 24" width="28" height="28">
                        <path fill="#ffffff" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </button>
                <span class="social-label" style="opacity: 0.5;">페이스북</span>
            </div>

            <div class="social-item">
                <button class="social-btn naver-btn" disabled>
                    <span class="naver-icon-text">N</span>
                </button>
                <span class="social-label" style="opacity: 0.5;">네이버</span>
            </div>

            <div class="social-item">
                <button class="social-btn google-btn" onclick="handleGoogleLogin()">
                    <svg width="28" height="28" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                </button>
                <span class="social-label">구글</span>
            </div>
        </div>

        <!-- 하단 안내 문구 -->
        <div class="login-notice">
            회원가입 없이 소셜 계정을 통해 바로 이용 가능하며 첫 로그인 시<br>
            <a href="#" onclick="return false;">이용약관</a> 및 <a href="#" onclick="return false;">개인정보처리방침</a> 동의로 간주됩니다.
        </div>
    </div>
</div>

<!-- 2. 로그인 성공 후 노출되는 메인 앱 화면 (초기 숨김 처리) -->
<div class="container" id="mainApp" style="display: none;">
    <div class="header-title">
        <h1>🚗 운전면허 필기 마스터</h1>
        <!-- 돋보기 아이콘을 활용한 글자 크기 조절 버튼 -->
        <div class="font-size-control" style="display: flex; gap: 4px; margin-left: auto;">
            <button onclick="adjustFontSize(-1)" title="글자 작게" style="padding: 2px 6px; font-size: 0.8rem; font-weight: bold; background: #e2e8f0; border: none; border-radius: 6px; cursor: pointer;">🔍-</button>
            <button onclick="adjustFontSize(1)" title="글자 크게" style="padding: 2px 6px; font-size: 0.8rem; font-weight: bold; background: #e2e8f0; border: none; border-radius: 6px; cursor: pointer;">🔍+</button>
        </div>
        <!-- <button class="help-btn" onclick="showSwipeGuide(true)" title="스와이프 안내 다시보기" style="margin-left: 4px;">💡</button> -->
        <button class="logout-link-btn" onclick="handleLogout()">로그아웃</button>
    </div>

    <div class="tab-group">
        <button class="tab-btn active" id="tabMemorize" onclick="switchMode('memorize')">⚡ 암기장 모드</button>
        <button class="tab-btn" id="tabExam" onclick="switchMode('exam')">📝 모의고사 모드</button>
    </div>

    <div class="top-nav" id="topNav">
        <div id="navLeft" style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
            <div>
                <span>문제 번호: </span>
                <input type="number" id="qInput" min="1" value="1">
                <button onclick="jumpToQ()">이동</button>
            </div>
            <label class="hide-toggle-label">
                <input type="checkbox" id="hideMemorizedCheck" onchange="toggleHideMemorized()" checked>
                외운 문제 제외
            </label>
        </div>

        <div id="examStartBox" class="exam-setup-group" style="display:none;">
            <div class="exam-setup-row">
                <div class="setup-item" style="width: 100%;">
                    <span class="setup-label">필터</span>
                    <select id="examFilterSelect" class="custom-select" style="flex: 1;">
                        <option value="all" selected>전체 문제</option>
                        <option value="unmemorized">미완료 문제만</option>
                        <option value="memorized">외운 문제만</option>
                        <option value="wrong">틀린 문제만</option>
                        <option value="bookmarked">북마크 문제만</option>
                    </select>
                </div>
            </div>

            <div class="exam-setup-row">
                <div class="setup-item" style="width: 100%;">
                    <span class="setup-label">범위</span>
                    <div class="range-input-container">
                        <input type="number" id="rangeStart" min="1" value="1"> 
                        <span class="range-tilde">~</span> 
                        <input type="number" id="rangeEnd" min="1" value="100">
                    </div>
                </div>
            </div>

            <div class="exam-setup-row">
                <div class="setup-item" style="flex: 1;">
                    <span class="setup-label">문항</span>
                    <select id="examCountSelect" class="custom-select" style="flex: 1;">
                        <option value="5" selected>5문제</option>
                        <option value="10">10문제</option>
                        <option value="20">20문제</option>
                        <option value="40">40문제</option>
                    </select>
                </div>
                <button onclick="startNewExam()" class="exam-start-btn">🚀 시작</button>
            </div>
        </div>

        <div class="timer-box" id="timerBox" style="display:none;">⏱️ 40:00</div>
        <span id="totalIdx">0 / 0</span>
    </div>

    <div class="card-wrapper" id="cardWrapper">
        <div class="exam-ready-screen" id="examBeforeStart" style="display:none;">
            <div style="font-size: 1.5rem; margin-bottom: 8px;">📝</div>
            <div style="font-weight: bold; color: #334155; font-size: 0.95rem; margin-bottom: 4px;">모의고사 모드 준비 중</div>
            <div style="color: #64748b; font-size: 0.8rem;">상단에서 조건을 설정하고 [🚀 시작] 버튼을 눌러주세요.</div>
        </div>

        <div class="card" id="cardBox">
            <div id="loading">
                <div style="font-weight: bold; color: #2563eb; line-height: 1.4; font-size: 0.9rem;">
                    🔄 문제 데이터를 불러오는 중입니다...
                </div>
            </div>
            
            <div id="quizContent" style="display:none; flex-direction: column;">
            <div class="q-header" id="qHeader">
                <span style="font-size:0.75rem; font-weight:bold; color:#64748b;" id="qCategory">문제</span>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <!-- [추가] 북마크 체크박스 -->
                    <label class="bookmark-check" style="font-size: 0.8rem; font-weight: bold; color: #eab308; cursor: pointer;">
                        <input type="checkbox" id="itemBookmarkCheck" onchange="toggleItemBookmark(this.checked)" style="accent-color: #eab308; width: 15px; height: 15px; cursor: pointer;">
                        북마크
                    </label>
                    
                    <label class="memorized-check">
                        <input type="checkbox" id="itemMemorizedCheck" onchange="toggleItemMemorized(this.checked)">
                        완료 (외움)
                    </label>
                </div>
            </div>

                <div class="q-text" id="qText"></div>

                <div class="options-list" id="optList" style="display:none;"></div>
                <div class="memorize-options-list" id="memOptList" style="display:none;"></div>

                <div id="qImgContainer" class="q-img-container" style="display: none;">
                    <img id="qImage" class="q-img" src="" alt="문제 이미지">
                    <div id="qImageDesc" class="q-img-desc"></div>
                </div>
            </div>

            <div id="resultContent" class="result-screen" style="display:none;">
                <div style="font-size: 0.95rem; font-weight: bold; color: #475569;">시험 결과</div>
                <div id="scoreText" class="result-score">0점</div>
                <div id="passText" style="font-size: 1rem; font-weight: bold; margin-bottom: 6px;"></div>
                <div id="resultDetail" style="color: #64748b; font-size: 0.85rem;"></div>
                <button class="restart-btn" onclick="resetExamSetup()">🔄 다시 도전하기</button>
            </div>
        </div>
    </div>

    <div class="toast-msg" id="toastMsg">👈 좌우로 스와이프 또는 방향키(←/→)로 넘기세요</div>

    <div class="btn-group" id="btnGroup" style="display:none;">
        <button class="btn btn-submit" id="submitBtn" onclick="submitExam()">시험 제출</button>
    </div>
</div>

<script type="module" src="./script.js"></script>
</body>
</html>
